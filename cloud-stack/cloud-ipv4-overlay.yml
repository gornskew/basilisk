# The ship's network, IPv4 only: a cloud session's vat has a kernel
# with no IPv6 at all (no /proc/sys/net/ipv6), and the base articles
# ask for a dual-stack network, which the vat then cannot create --
# "Cannot read IPv6 setup for bridge", and no room starts (first
# cloud raise, 2026-09-25).  Hand-written, not generated: the
# generator emits a network block for the base ship only.
# cloud-stack/setup.sh copies this beside docker-compose.yml, where
# the yard reads every .yml; the copy is per-clone state and ignored.

networks:
  ship:
    enable_ipv6: false
    ipam: !override
      config:
        - subnet: "172.20.0.0/16"
