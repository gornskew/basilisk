services:

  cyclops:
    image: gornskew/cyclops:master
    container_name: ${BASILISK_PREFIX:-}cyclops
    hostname: cyclops
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "${CYCLOPS_HOST_PORT:-19069}:80"
      - "${CYCLOPS_UTILITY_HOST_PORT:-19191}:9191"
    environment:
      - HTTP_PORT=80
      - HTTP_HOST_PORT=${CYCLOPS_HOST_PORT:-19069}
      - START_HTTP=true
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - type: bind
        source: ${PROJECTS_DIR}
        target: /projects
        bind:
          create_host_path: true
      - ${CYCLOPS_CONFIG:-${PROJECTS_DIR}/narad-stack/cyclops-narad.sexp}:/etc/cyclops/cyclops.sexp:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - skewed-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/_cyclops/status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

